<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="265" viewBox="0 0 620 265" role="img" aria-labelledby="distTitle distDesc">
  <title id="distTitle">Distributing multiplication across a bracket</title>
  <desc id="distDesc">The factor three in three times x plus four multiplies both x and four. Two arrows lead from three to the partial products three times x and three times four, which become three x plus twelve.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2368ad"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237b4b"/></marker>
  </defs>
  <g fill="#181818" font-family="Georgia, 'Times New Roman', serif" font-size="41">
    <text x="225" y="63" text-anchor="middle">3</text>
    <text x="341" y="63" text-anchor="middle">(x + 4)</text>
  </g>
  <path d="M215 74 C192 88 185 103 183 120" fill="none" stroke="#2368ad" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <path d="M237 74 C332 88 411 102 430 120" fill="none" stroke="#237b4b" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <rect x="103" y="125" width="176" height="62" rx="9" fill="#eaf2fa" stroke="#2368ad" stroke-width="2"/>
  <rect x="340" y="125" width="177" height="62" rx="9" fill="#edf6ef" stroke="#237b4b" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="31" text-anchor="middle">
    <text x="191" y="166" fill="#143f70">3 × x</text>
    <text x="429" y="166" fill="#1d5937">3 × 4</text>
  </g>
  <g fill="#181818" font-family="Georgia, 'Times New Roman', serif" font-size="33" text-anchor="middle">
    <text x="310" y="239">3x + 12</text>
  </g>
  <path d="M191 196 Q240 220 276 221" fill="none" stroke="#2368ad" stroke-width="2"/>
  <path d="M429 196 Q380 220 344 221" fill="none" stroke="#237b4b" stroke-width="2"/>
</svg>
