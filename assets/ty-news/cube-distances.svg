<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title"><title id="title">A cube has twelve unit edges, face diagonals of square root two, and body diagonals of square root three</title><rect width="100%" height="100%" rx="22" fill="#f7f6fb"/><g font-family="Arial, sans-serif"><text x="500" y="62" text-anchor="middle" font-size="34" font-weight="700" fill="#51458c">THE CUBE: WHICH DISTANCES ARE 1?</text><line x1="235" y1="220" x2="495" y2="220" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><line x1="495" y1="220" x2="495" y2="480" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><line x1="495" y1="480" x2="235" y2="480" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><line x1="235" y1="480" x2="235" y2="220" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><line x1="385" y1="120" x2="645" y2="120" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><line x1="645" y1="120" x2="645" y2="380" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><line x1="645" y1="380" x2="385" y2="380" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><line x1="385" y1="380" x2="385" y2="120" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><line x1="235" y1="220" x2="385" y2="120" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><line x1="495" y1="220" x2="645" y2="120" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><line x1="495" y1="480" x2="645" y2="380" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><line x1="235" y1="480" x2="385" y2="380" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><line x1="235" y1="480" x2="495" y2="220" stroke="#d28a19" stroke-width="5" stroke-dasharray="9 7" stroke-linecap="round"/><line x1="235" y1="480" x2="645" y2="120" stroke="#bd343c" stroke-width="5" stroke-dasharray="5 7" stroke-linecap="round"/><circle cx="235" cy="220" r="9" fill="#202b3d"/><circle cx="495" cy="220" r="9" fill="#202b3d"/><circle cx="495" cy="480" r="9" fill="#202b3d"/><circle cx="235" cy="480" r="9" fill="#202b3d"/><circle cx="385" cy="120" r="9" fill="#202b3d"/><circle cx="645" cy="120" r="9" fill="#202b3d"/><circle cx="645" cy="380" r="9" fill="#202b3d"/><circle cx="385" cy="380" r="9" fill="#202b3d"/><text x="500" y="540" text-anchor="middle" font-size="25" font-weight="500" fill="#202b3d">12 edges: 1     face diagonal: √2     body diagonal: √3</text><text x="500" y="590" text-anchor="middle" font-size="24" font-weight="500" fill="#51458c">A 3D example. The Erdős question keeps every point in a plane.</text></g></svg>