<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title"><title id="title">A unit square has four unit-distance pairs; a rhombus of two equilateral triangles has five</title><rect width="100%" height="100%" rx="22" fill="#f7f6fb"/><g font-family="Arial, sans-serif"><text x="500" y="62" text-anchor="middle" font-size="31" font-weight="700" fill="#51458c">FOUR POINTS. CAN WE MAKE MORE UNIT PAIRS?</text><line x1="250" y1="420" x2="70" y2="420" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><line x1="70" y1="240" x2="70" y2="420" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><line x1="250" y1="240" x2="250" y2="420" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><line x1="250" y1="240" x2="70" y2="240" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><circle cx="70" cy="420" r="12" fill="#202b3d"/><circle cx="250" cy="420" r="12" fill="#202b3d"/><circle cx="70" cy="240" r="12" fill="#202b3d"/><circle cx="250" cy="240" r="12" fill="#202b3d"/><text x="215" y="180" text-anchor="middle" font-size="38" font-weight="700" fill="#146f9a">4 unit pairs</text><line x1="730" y1="420" x2="550" y2="420" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><line x1="640.0" y1="264.11542731880104" x2="550" y2="420" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><line x1="640.0" y1="264.11542731880104" x2="730" y2="420" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><line x1="820.0" y1="264.11542731880104" x2="730" y2="420" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><line x1="820.0" y1="264.11542731880104" x2="640.0" y2="264.11542731880104" stroke="#146f9a" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><circle cx="550" cy="420" r="12" fill="#202b3d"/><circle cx="730" cy="420" r="12" fill="#202b3d"/><circle cx="640.0" cy="264.11542731880104" r="12" fill="#202b3d"/><circle cx="820.0" cy="264.11542731880104" r="12" fill="#202b3d"/><text x="695" y="180" text-anchor="middle" font-size="38" font-weight="700" fill="#146f9a">5 unit pairs</text><text x="500" y="535" text-anchor="middle" font-size="27" font-weight="500" fill="#202b3d">Only blue links are exactly one unit long.</text><text x="500" y="583" text-anchor="middle" font-size="25" font-weight="500" fill="#202b3d">All four points stay on the same flat plane.</text></g></svg>