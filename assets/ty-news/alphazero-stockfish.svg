<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title"><title id="title">An exact proportional bar: 155 AlphaZero wins, 839 draws and 6 Stockfish wins</title><rect width="100%" height="100%" rx="22" fill="#f7f6fb"/><g font-family="Arial, sans-serif"><text x="500" y="62" text-anchor="middle" font-size="35" font-weight="700" fill="#51458c">ALPHAZERO AGAINST STOCKFISH</text><text x="500" y="115" text-anchor="middle" font-size="26" font-weight="500" fill="#202b3d">The 1,000-game evaluation reported in 2018</text><rect x="60" y="165" width="136.4" height="85" rx="0" fill="#146f9a" stroke="none"/><rect x="196.4" y="165" width="738.32" height="85" rx="0" fill="#bfc9d9" stroke="none"/><rect x="934.72" y="165" width="5.28" height="85" rx="0" fill="#bd343c" stroke="none"/><text x="190" y="330" text-anchor="middle" font-size="62" font-weight="700" fill="#146f9a">155</text><text x="190" y="375" text-anchor="middle" font-size="24" font-weight="500" fill="#146f9a">AlphaZero wins</text><text x="505" y="330" text-anchor="middle" font-size="62" font-weight="700" fill="#202b3d">839</text><text x="505" y="375" text-anchor="middle" font-size="24" font-weight="500" fill="#202b3d">Draws</text><text x="810" y="330" text-anchor="middle" font-size="62" font-weight="700" fill="#bd343c">6</text><text x="810" y="375" text-anchor="middle" font-size="24" font-weight="500" fill="#bd343c">Stockfish wins</text><rect x="30" y="450" width="290" height="80" rx="16" fill="#e8e3f4" stroke="none"/><text x="175" y="500" text-anchor="middle" font-size="23" font-weight="500" fill="#51458c">Play itself</text><rect x="355" y="450" width="290" height="80" rx="16" fill="#e8e3f4" stroke="none"/><text x="500" y="500" text-anchor="middle" font-size="23" font-weight="500" fill="#51458c">Learn from results</text><rect x="680" y="450" width="290" height="80" rx="16" fill="#e8e3f4" stroke="none"/><text x="825" y="500" text-anchor="middle" font-size="23" font-weight="500" fill="#51458c">Test against a rival</text><text x="500" y="585" text-anchor="middle" font-size="20" font-weight="500" fill="#202b3d">Historical test conditions; this is not a ranking of today’s engines.</text></g></svg>