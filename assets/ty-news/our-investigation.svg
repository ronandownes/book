<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title"><title id="title">Ask, test, explain and state a precise conclusion</title><rect width="100%" height="100%" rx="22" fill="#f7f6fb"/><g font-family="Arial, sans-serif"><text x="500" y="70" text-anchor="middle" font-size="40" font-weight="700" fill="#51458c">OUR INVESTIGATION</text><rect x="60" y="140" width="420" height="165" rx="16" fill="white" stroke="#d7d2e7"/><text x="270" y="200" text-anchor="middle" font-size="34" font-weight="700" fill="#51458c">1. Ask</text><text x="270" y="248" text-anchor="middle" font-size="23" font-weight="500" fill="#202b3d">What exactly</text><text x="270" y="279" text-anchor="middle" font-size="23" font-weight="500" fill="#202b3d">is the claim?</text><rect x="520" y="140" width="420" height="165" rx="16" fill="white" stroke="#d7d2e7"/><text x="730" y="200" text-anchor="middle" font-size="34" font-weight="700" fill="#51458c">2. Test</text><text x="730" y="248" text-anchor="middle" font-size="23" font-weight="500" fill="#202b3d">Can another student</text><text x="730" y="279" text-anchor="middle" font-size="23" font-weight="500" fill="#202b3d">repeat my checks?</text><rect x="60" y="350" width="420" height="165" rx="16" fill="white" stroke="#d7d2e7"/><text x="270" y="410" text-anchor="middle" font-size="34" font-weight="700" fill="#51458c">3. Explain</text><text x="270" y="458" text-anchor="middle" font-size="23" font-weight="500" fill="#202b3d">Why does</text><text x="270" y="489" text-anchor="middle" font-size="23" font-weight="500" fill="#202b3d">the pattern happen?</text><rect x="520" y="350" width="420" height="165" rx="16" fill="white" stroke="#d7d2e7"/><text x="730" y="410" text-anchor="middle" font-size="34" font-weight="700" fill="#51458c">4. Be precise</text><text x="730" y="458" text-anchor="middle" font-size="23" font-weight="500" fill="#202b3d">What have</text><text x="730" y="489" text-anchor="middle" font-size="23" font-weight="500" fill="#202b3d">I actually established?</text></g></svg>