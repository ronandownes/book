<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title"><title id="title">A sign error in one paper affects two papers depending on it; all three are withdrawn</title><rect width="100%" height="100%" rx="22" fill="#f7f6fb"/><g font-family="Arial, sans-serif"><text x="500" y="65" text-anchor="middle" font-size="33" font-weight="700" fill="#51458c">A MISTAKE CAN AFFECT OTHER PAPERS</text><rect x="300" y="120" width="400" height="125" rx="16" fill="#fde9e7" stroke="none"/><text x="500" y="175" text-anchor="middle" font-size="27" font-weight="500" fill="#bd343c">One paper contains a sign error</text><text x="500" y="215" text-anchor="middle" font-size="23" font-weight="500" fill="#202b3d">Its argument fails</text><line x1="500" y1="250" x2="250" y2="335" stroke="#bd343c" stroke-width="5" stroke-dasharray="" stroke-linecap="round"/><rect x="70" y="345" width="360" height="120" rx="16" fill="#eeeaf6" stroke="none"/><text x="250" y="395" text-anchor="middle" font-size="25" font-weight="500" fill="#51458c">Another paper uses it</text><text x="250" y="435" text-anchor="middle" font-size="23" font-weight="500" fill="#202b3d">This must be rechecked</text><line x1="500" y1="250" x2="750" y2="335" stroke="#bd343c" stroke-width="5" stroke-dasharray="" stroke-linecap="round"/><rect x="570" y="345" width="360" height="120" rx="16" fill="#eeeaf6" stroke="none"/><text x="750" y="395" text-anchor="middle" font-size="25" font-weight="500" fill="#51458c">Another paper uses it</text><text x="750" y="435" text-anchor="middle" font-size="23" font-weight="500" fill="#202b3d">This must be rechecked</text><text x="500" y="550" text-anchor="middle" font-size="30" font-weight="700" fill="#bd343c">7 October: three manuscripts withdrawn</text></g></svg>