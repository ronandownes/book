<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title"><title id="title">The expectation, construction, independent checking and counterexample of May 2026</title><rect width="100%" height="100%" rx="22" fill="#f7f6fb"/><g font-family="Arial, sans-serif"><text x="500" y="65" text-anchor="middle" font-size="36" font-weight="700" fill="#51458c">WHAT FAILED WAS A CONJECTURE</text><rect x="60" y="130" width="420" height="170" rx="16" fill="#eeeaf6" stroke="none"/><text x="270" y="185" text-anchor="middle" font-size="29" font-weight="700" fill="#51458c">The expectation</text><text x="270" y="233" text-anchor="middle" font-size="21" font-weight="500" fill="#202b3d">Grid-based arrangements</text><text x="270" y="264" text-anchor="middle" font-size="21" font-weight="500" fill="#202b3d">were essentially best.</text><rect x="520" y="130" width="420" height="170" rx="16" fill="#dfeefa" stroke="none"/><text x="730" y="185" text-anchor="middle" font-size="29" font-weight="700" fill="#51458c">A new construction</text><text x="730" y="233" text-anchor="middle" font-size="21" font-weight="500" fill="#202b3d">A different family</text><text x="730" y="264" text-anchor="middle" font-size="21" font-weight="500" fill="#202b3d">beats the predicted growth.</text><rect x="60" y="345" width="420" height="170" rx="16" fill="#e2f0e7" stroke="none"/><text x="270" y="400" text-anchor="middle" font-size="29" font-weight="700" fill="#51458c">Human checking</text><text x="270" y="448" text-anchor="middle" font-size="21" font-weight="500" fill="#202b3d">Mathematicians checked and</text><text x="270" y="479" text-anchor="middle" font-size="21" font-weight="500" fill="#202b3d">explained the proof.</text><rect x="520" y="345" width="420" height="170" rx="16" fill="#fde9e7" stroke="none"/><text x="730" y="400" text-anchor="middle" font-size="29" font-weight="700" fill="#51458c">The conclusion</text><text x="730" y="448" text-anchor="middle" font-size="21" font-weight="500" fill="#202b3d">The old</text><text x="730" y="479" text-anchor="middle" font-size="21" font-weight="500" fill="#202b3d">conjecture is false.</text><text x="500" y="583" text-anchor="middle" font-size="23" font-weight="500" fill="#202b3d">20 May 2026 · this is not the cube construction</text></g></svg>