<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" role="img" aria-labelledby="t d"><title id="t">Two mutually exclusive card suits</title><desc id="d">A universal set of 52 cards, with separate disjoint sets of spades and hearts. Clubs and diamonds remain outside both.</desc><rect width="700" height="390" fill="white"/><rect x="55" y="63" width="590" height="300" fill="#f8fbff" stroke="#2b526c" stroke-width="5"/><text x="53" y="46" font-family="Arial,sans-serif" font-weight="bold" font-size="32">U</text><ellipse cx="224" cy="202" rx="142" ry="112" fill="#e7f2fa" stroke="#225c86" stroke-width="5"/><ellipse cx="476" cy="202" rx="142" ry="112" fill="#eef7ee" stroke="#38865f" stroke-width="5"/><g font-family="Arial,sans-serif" font-size="30" font-weight="bold"><text x="118" y="126" fill="#225c86">S</text><text x="370" y="126" fill="#38865f">H</text></g><g font-family="Arial,sans-serif" font-size="27" text-anchor="middle" fill="#173c57"><text x="224" y="204">Spades</text><text x="476" y="204">Hearts</text><text x="350" y="345" font-size="22">Clubs and diamonds are outside both</text></g></svg>