<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="t d"><title id="t">Universal set and complement</title><desc id="d">U is labelled outside the rectangular boundary. The area in U but outside the A oval is hatched, representing A complement.</desc><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#b2c5d4" stroke-width="4"/></pattern><mask id="outside"><rect x="0" y="0" width="700" height="420" fill="white"/><ellipse cx="352" cy="224" rx="210" ry="130" fill="black"/></mask></defs><rect width="700" height="420" fill="white"/><rect x="73" y="65" width="554" height="322" fill="url(#hatch)" mask="url(#outside)"/><rect x="73" y="65" width="554" height="322" fill="none" stroke="#2b526c" stroke-width="5"/><text x="71" y="48" font-family="Arial,sans-serif" font-size="35" font-weight="bold" fill="#173c57">U</text><ellipse cx="352" cy="224" rx="210" ry="130" fill="#f5faff" stroke="#225c86" stroke-width="5"/><text x="193" y="136" font-family="Arial,sans-serif" font-weight="bold" font-size="35" fill="#174765">A</text><text x="352" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#174765">inside A</text><text x="514" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#174765">A′</text></svg>