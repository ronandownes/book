<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="title desc">
  <title id="title">Universal set and complement</title>
  <desc id="desc">The rectangle is U. The oval A sits inside it. Digital shading marks A complement: the part of U outside A.</desc>
  <defs>
    <mask id="outside">
      <rect x="73" y="65" width="554" height="322" fill="#fff"/>
      <ellipse cx="352" cy="224" rx="210" ry="130" fill="#000"/>
    </mask>
  </defs>
  <rect width="700" height="420" fill="#fff"/>
  <rect x="73" y="65" width="554" height="322" fill="#efc36b" fill-opacity=".68" mask="url(#outside)"/>
  <rect x="73" y="65" width="554" height="322" fill="none" stroke="#2b526c" stroke-width="5"/>
  <text x="71" y="48" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#173c57">U</text>
  <ellipse cx="352" cy="224" rx="210" ry="130" fill="#fff" stroke="#225c86" stroke-width="5"/>
  <text x="193" y="136" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#174765">A</text>
  <text x="352" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#174765">inside A</text>
  <text x="514" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#174765">Aᶜ</text>
</svg>
