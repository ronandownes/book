<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">The integer roster and number line</title>
  <desc id="desc">A number line shows integers from negative three to positive three. Opposite integers are paired around zero. The roster form is Z equals the set containing zero, plus or minus one, plus or minus two, and so on.</desc>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="600" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#173c57">Integers pair up around zero</text>

  <rect x="55" y="92" width="1090" height="410" rx="24" fill="#f7fafc" stroke="#d7e0e9" stroke-width="3"/>
  <text x="600" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#53677b">Opposite numbers are the same distance from zero.</text>
  <path d="M480 185 Q600 125 720 185" fill="none" stroke="#6d4a88" stroke-width="4"/>
  <text x="600" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#6d4a88">−1 and +1</text>
  <path d="M330 255 Q600 173 870 255" fill="none" stroke="#b06b1f" stroke-width="4"/>
  <text x="600" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#9a5a18">−2 and +2</text>

  <line x1="125" y1="350" x2="1075" y2="350" stroke="#294b65" stroke-width="5"/>
  <path d="M1075 350 l-18 -11 v22 z" fill="#294b65"/>
  <g stroke="#294b65" stroke-width="4" fill="#fff">
    <circle cx="180" cy="350" r="20"/><circle cx="330" cy="350" r="20"/>
    <circle cx="480" cy="350" r="20"/><circle cx="600" cy="350" r="24"/>
    <circle cx="720" cy="350" r="20"/><circle cx="870" cy="350" r="20"/>
    <circle cx="1020" cy="350" r="20"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#173c57">
    <text x="180" y="410">−3</text><text x="330" y="410">−2</text>
    <text x="480" y="410">−1</text><text x="600" y="410">0</text>
    <text x="720" y="410">1</text><text x="870" y="410">2</text><text x="1020" y="410">3</text>
  </g>
  <text x="600" y="468" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#53677b">Zero appears once; each opposite pair contains two integers.</text>

  <text x="600" y="575" text-anchor="middle" font-family="Georgia,serif" font-size="39" font-weight="700" fill="#173c57">ℤ = {0, ±1, ±2, ±3, …}</text>
  <text x="600" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#53677b">For example, ±2 means both −2 and +2.</text>
</svg>
