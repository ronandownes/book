<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" role="img" aria-labelledby="title desc">
<title id="title">A mapping between two finite sets</title>
<desc id="desc">A contains 1, 2, 3. B contains 2, 4, 6, 8. Arrows connect 1 to 2, 2 to 4, 3 to 6. The element 8 in the codomain is not an output.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#244a6c"/></marker></defs>
<rect x="1" y="1" width="698" height="308" rx="10" fill="#fff" stroke="#cdd6df"/>
<ellipse cx="170" cy="173" rx="112" ry="107" fill="#dcecff" stroke="#24659e" stroke-width="3"/>
<ellipse cx="520" cy="173" rx="112" ry="107" fill="#ddf4e3" stroke="#267b48" stroke-width="3"/>
<g fill="#203248" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">
<text x="170" y="40" font-weight="bold">A — domain</text>
<text x="520" y="40" font-weight="bold">B — codomain</text>
<text x="170" y="117">1</text><text x="170" y="182">2</text><text x="170" y="247">3</text>
<text x="520" y="96">2</text><text x="520" y="144">4</text><text x="520" y="192">6</text><text x="520" y="241">8</text>
</g>
<g stroke="#244a6c" stroke-width="2.8" fill="none" marker-end="url(#arrow)">
<path d="M190 106 Q350 27 495 87"/>
<path d="M190 172 Q345 112 495 136"/>
<path d="M190 238 Q345 224 495 185"/>
</g>
<text x="350" y="286" font-family="Arial, sans-serif" font-size="19" fill="#244a6c" text-anchor="middle">f(x) = 2x; image = {2, 4, 6}</text>
</svg>