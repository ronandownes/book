<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">Eight regions in a three-set Venn diagram</title>
  <desc id="desc">Three overlapping sets have A only 9, B only 8, C only 6, AB only 5, AC only 4, BC only 3, and all three 2. The union contains 37 students.</desc>
  <rect width="900" height="650" fill="#fff"/>
  <ellipse cx="365" cy="245" rx="215" ry="180" fill="#dcebf7" fill-opacity=".62" stroke="#225c86" stroke-width="5"/>
  <ellipse cx="535" cy="245" rx="215" ry="180" fill="#e4f1e8" fill-opacity=".62" stroke="#38865f" stroke-width="5"/>
  <ellipse cx="450" cy="385" rx="215" ry="180" fill="#f8e8d9" fill-opacity=".58" stroke="#a45a32" stroke-width="5"/>
  <g font-family="Arial,sans-serif" font-size="37" font-weight="700">
    <text x="278" y="95" fill="#225c86">A</text>
    <text x="608" y="95" fill="#38865f">B</text>
    <text x="438" y="588" fill="#a45a32">C</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#173c57">
    <text x="282" y="255">A only 9</text>
    <text x="618" y="255">B only 8</text>
    <text x="450" y="532">C only 6</text>
    <text x="450" y="190">AB only 5</text>
    <text x="355" y="396">AC only 4</text>
    <text x="545" y="396">BC only 3</text>
    <text x="450" y="330">All three 2</text>
  </g>
  <text x="450" y="630" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#294b65">Union: 9 + 8 + 6 + 5 + 4 + 3 + 2 = 37</text>
</svg>
