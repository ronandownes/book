<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1220" role="img" aria-labelledby="title desc">
  <title id="title">The complement depends on the universal set</title>
  <desc id="desc">Two digitally shaded Venn diagrams compare what is not red in two different universal sets. In a standard pack, red cards have black cards as their complement. In the three traffic-light states, red has amber and green as its complement.</desc>
  <rect width="900" height="1220" fill="#ffffff"/>
  <text x="450" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#173c57">The complement depends on U</text>
  <text x="450" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" fill="#345a73">Same question: what is not red?</text>

  <rect x="40" y="140" width="820" height="440" rx="22" fill="#ffffff" stroke="#d4e0e8" stroke-width="3"/>
  <text x="78" y="190" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#173c57">U = a standard pack of 52 cards</text>
  <text x="78" y="229" font-family="Arial,sans-serif" font-size="29" fill="#345a73">A is the set of red cards</text>
  <rect x="80" y="250" width="740" height="275" rx="5" fill="#deedf6" stroke="#2b5f7f" stroke-width="5"/>
  <text x="108" y="291" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#173c57">U</text>
  <ellipse cx="350" cy="389" rx="185" ry="99" fill="#ffffff" stroke="#2b5f7f" stroke-width="5"/>
  <text x="350" y="366" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#173c57">A</text>
  <text x="350" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" fill="#173c57">red cards</text>
  <text x="350" y="447" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#173c57">#A = 26</text>
  <text x="680" y="362" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#173c57">Aᶜ</text>
  <text x="680" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#173c57">black cards</text>
  <text x="680" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#173c57">#Aᶜ = 26</text>

  <rect x="40" y="600" width="820" height="470" rx="22" fill="#ffffff" stroke="#d4e0e8" stroke-width="3"/>
  <text x="78" y="651" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#173c57">U = the three traffic-light states</text>
  <text x="78" y="691" font-family="Arial,sans-serif" font-size="29" fill="#345a73">U = {red, amber, green}; A = {red}</text>
  <rect x="80" y="715" width="740" height="285" rx="5" fill="#deedf6" stroke="#2b5f7f" stroke-width="5"/>
  <text x="108" y="757" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#173c57">U</text>
  <ellipse cx="285" cy="858" rx="145" ry="105" fill="#ffffff" stroke="#2b5f7f" stroke-width="5"/>
  <circle cx="285" cy="830" r="29" fill="#cf4242" stroke="#ffffff" stroke-width="4"/>
  <text x="285" y="895" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#173c57">A = red</text>
  <text x="285" y="935" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#173c57">#A = 1</text>
  <text x="620" y="788" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#173c57">Aᶜ</text>
  <circle cx="575" cy="850" r="24" fill="#efb83e" stroke="#ffffff" stroke-width="4"/>
  <text x="620" y="859" font-family="Arial,sans-serif" font-size="29" fill="#173c57">amber</text>
  <circle cx="575" cy="927" r="24" fill="#438b5d" stroke="#ffffff" stroke-width="4"/>
  <text x="620" y="936" font-family="Arial,sans-serif" font-size="29" fill="#173c57">green</text>
  <text x="620" y="976" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#173c57">#Aᶜ = 2</text>

  <text x="450" y="1122" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#173c57">Choose U first.</text>
  <text x="450" y="1167" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#173c57">Then “not A” has a precise meaning.</text>
  <text x="450" y="1205" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#345a73">Objects outside U are not part of Aᶜ.</text>
</svg>
