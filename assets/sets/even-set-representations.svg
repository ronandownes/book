<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" role="img" aria-labelledby="title desc">
  <title id="title">Rule, list and spatial element diagram for the even numbers in D</title>
  <desc id="desc">The collection D is 1 through 11. A single oval E contains 2, 4, 6, 8 and 10. Every number, inside or outside, is paired with a solid element dot and shown at the same label size. The odd numbers 1, 3, 5, 7, 9 and 11 sit outside E.</desc>
  <rect width="800" height="820" fill="#fff"/>
  <text x="400" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#294b65">Rule: E contains the even numbers in D</text>

  <ellipse cx="400" cy="410" rx="240" ry="220" fill="#e8f3fb" stroke="#225c86" stroke-width="6"/>
  <text x="172" y="232" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#174765">E</text>

  <g fill="#173c57">
    <circle cx="300" cy="292" r="8"/><circle cx="500" cy="298" r="8"/>
    <circle cx="400" cy="410" r="8"/>
    <circle cx="300" cy="520" r="8"/><circle cx="500" cy="530" r="8"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#173c57">
    <text x="324" y="305">2</text><text x="524" y="311">4</text>
    <text x="424" y="423">6</text>
    <text x="324" y="533">8</text><text x="524" y="543">10</text>
  </g>

  <g fill="#53677b">
    <circle cx="90" cy="292" r="8"/><circle cx="710" cy="292" r="8"/>
    <circle cx="90" cy="410" r="8"/><circle cx="710" cy="410" r="8"/>
    <circle cx="90" cy="530" r="8"/><circle cx="710" cy="530" r="8"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#173c57">
    <text x="115" y="305">1</text><text x="735" y="305">3</text>
    <text x="115" y="423">5</text><text x="735" y="423">7</text>
    <text x="115" y="543">9</text><text x="735" y="543">11</text>
  </g>

  <text x="400" y="780" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#174765">List: E = {2, 4, 6, 8, 10}</text>
</svg>
