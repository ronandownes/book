<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Rule, list and one-oval diagram for the even numbers</title>
  <desc id="desc">The candidate collection D is 1 through 8. The rule selects even numbers. The oval E contains 2, 4, 6 and 8; 1, 3, 5 and 7 are outside E.</desc>
  <rect width="900" height="520" fill="#fff"/>
  <text x="450" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#173c57">Candidate collection: D = {1, 2, 3, 4, 5, 6, 7, 8}</text>
  <text x="450" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#294b65">Rule: E contains the even numbers in D</text>
  <ellipse cx="450" cy="300" rx="260" ry="145" fill="#e8f3fb" stroke="#225c86" stroke-width="6"/>
  <text x="235" y="190" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#174765">E</text>
  <g font-family="Arial,sans-serif" font-size="40" font-weight="700" text-anchor="middle" fill="#173c57">
    <text x="285" y="315">2</text><text x="395" y="315">4</text><text x="505" y="315">6</text><text x="615" y="315">8</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#53677b">
    <text x="125" y="260">1</text><text x="775" y="260">3</text><text x="125" y="365">5</text><text x="775" y="365">7</text>
  </g>
  <text x="450" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#174765">List: E = {2, 4, 6, 8}</text>
</svg>
