<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">Sine, cosine and tangent for acute marked angles</title>
<desc id="desc">Red sine rises from zero to one, blue cosine falls from one to zero, and dark tangent rises to the top of its separate scale before 90 degrees. A dashed vertical line at 90 degrees marks tangent's asymptote.</desc>
