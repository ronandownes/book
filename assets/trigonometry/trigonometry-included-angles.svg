<path d="M92 330 L143 330" stroke="#243d55" stroke-width="3" marker-end="url(#arrow)"/><path d="M232 278 L232 224" stroke="#243d55" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M28 330 Q26 311 22 306" stroke="#c63d43" stroke-width="3"/><path d="M232 205 Q212 204 205 213" stroke="#2369d1" stroke-width="3"/><path d="M212 330 v-18 h20" stroke="#18834b" stroke-width="5"/>
<text x="133" y="355" fill="#2369d1" font-size="20" font-family="Arial">a</text><text x="251" y="258" fill="#c63d43" font-size="20" font-family="Arial">o</text><text x="103" y="229" fill="#18834b" font-size="20" font-family="Arial">h</text><text x="40" y="321" fill="#c63d43" font-size="18" font-family="Arial" font-weight="700">θ</text><text x="210" y="190" fill="#2369d1" font-size="17" font-family="Arial" font-weight="700">unmarked</text><text x="207" y="304" fill="#18834b" font-size="15" font-family="Arial">90°</text>
</g></g></svg>