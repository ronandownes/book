name: Build and publish PreTeXt book
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PreTeXt
        run: python -m pip install -r requirements.txt
      - name: Retrieve open-licence cicada photographs
        run: |
          set -euo pipefail
          mkdir -p assets/cicadas
          curl --fail --location --retry 3 --silent --show-error \
            --user-agent "Mathematics educational textbook (source: Wikimedia Commons)" \
            "https://upload.wikimedia.org/wikipedia/commons/a/a9/Riley%27s_13-Year_Cicada_Magicicada_tredecim_JG.jpg" \
            --output assets/cicadas/magicicada-tredecim-2024.jpg
          curl --fail --location --retry 3 --silent --show-error \
            --user-agent "Mathematics educational textbook (source: Wikimedia Commons)" \
            "https://upload.wikimedia.org/wikipedia/commons/8/8e/Magicicada_septendecim-mating.jpg" \
            --output assets/cicadas/magicicada-septendecim-2024.jpg
          curl --fail --location --retry 3 --silent --show-error \
            --user-agent "Mathematics educational textbook (source: Wikimedia Commons)" \
            "https://upload.wikimedia.org/wikipedia/commons/9/9e/Periodical_cicadas_in_a_tree.jpg" \
            --output assets/cicadas/periodical-cicadas-tree-2024.jpg
          test "$(wc -c < assets/cicadas/periodical-cicadas-tree-2024.jpg)" -gt 50000
          test "$(wc -c < assets/cicadas/magicicada-tredecim-2024.jpg)" -gt 50000
          test "$(wc -c < assets/cicadas/magicicada-septendecim-2024.jpg)" -gt 50000
      - name: Generate JC and LC Ordinary Level learning outcomes
        run: |
          set -euo pipefail
          python -m pip install requests beautifulsoup4 pymupdf
          mkdir -p assets/syllabus
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 --silent --show-error \
            "https://www.curriculumonline.ie/getmedia/f6f2e822-2b0c-461e-bcd4-dfcde6decc0c/SCSEC25_Maths_syllabus_examination-2015_English.pdf" \
            --output assets/syllabus/LC_Mathematics_Syllabus_2015.pdf
          python scripts/build_intro_outcomes.py
          for strand in number geometry algebra statistics; do
            test -s "source/jc-${strand}-outcomes.ptx"
          done
          for strand in statistics geometry number algebra functions; do
            test -s "source/lc-ol-${strand}-outcomes.ptx"
          done
      - name: Add section-start Learning Intentions
        run: |
          set -euo pipefail
          python scripts/add_learning_intentions.py
          grep -q '<objectives>' source/sets-chapter.ptx
          grep -q '<objectives>' source/number-introduction.ptx
          grep -q '<objectives>' source/algebra-language.ptx
      - name: Build web textbook
        run: pretext build web
      - name: Apply Learning Intentions reading panels
        run: |
          set -euo pipefail
          node --check assets/learning-intentions.js
          cp assets/learning-intentions.css output/web/learning-intentions.css
          cp assets/learning-intentions.js output/web/learning-intentions.js
          python - <<'PY'
          from pathlib import Path
          site = Path("output/web")
          count = 0
          css = '<link rel="stylesheet" href="learning-intentions.css?v=1" data-learning-intentions="1"/>'
          js = '<script defer src="learning-intentions.js?v=1" data-learning-intentions="1"></script>'
          for page in site.glob("*.html"):
              html = page.read_text(encoding="utf-8")
              if "Learning Intentions" not in html or "</head>" not in html or "</body>" not in html:
                  continue
              if 'data-learning-intentions="1"' not in html:
                  html = html.replace("</head>", "  " + css + "\n</head>", 1)
                  html = html.replace("</body>", "  " + js + "\n</body>", 1)
                  page.write_text(html, encoding="utf-8")
              count += 1
          if count < 65:
              raise SystemExit("Learning Intentions present on only " + str(count) + " pages.")
          print("Published native Learning Intentions on " + str(count) + " pages.")
          PY
      - name: Add immediate checking to single-choice questions
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          site = Path("output/web")
          script = Path("assets/sets/auto-check.js")
          if not script.is_file():
              raise SystemExit("Auto-check source is missing.")
          source = script.read_text(encoding="utf-8")
          if "</script>" in source.lower():
              raise SystemExit("Auto-check source cannot be embedded safely.")
          marker = 'data-pretext-auto-check="sets-v4"'
          pattern = re.compile(r'<script data-pretext-auto-check="sets-[^"]+">.*?</script>', re.DOTALL)
          tag = f'<script {marker}>\n{source}\n</script>'
          updated = 0
          for page in site.rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              html = pattern.sub("", html)
              if "</body>" not in html:
                  continue
              page.write_text(html.replace("</body>", f"  {tag}\n</body>", 1), encoding="utf-8")
              updated += 1
          target = site / "sets-complement.html"
          if not target.is_file() or marker not in target.read_text(encoding="utf-8"):
              raise SystemExit("The Sets complement page is missing its automatic-check script.")
          if updated == 0:
              raise SystemExit("No web pages received automatic-check handling.")
          print(f"Embedded automatic checking in {updated} pages.")
          PY
      - name: Enhance native Junior Cycle Unifying Strand table
        run: |
          set -euo pipefail
          node --check assets/jc-unifying-native.js
          cp assets/jc-unifying-native.js output/web/jc-unifying-native.js
          cp assets/jc-unifying-native.css output/web/jc-unifying-native.css
          python - <<'PY'
          from pathlib import Path
          page = Path("output/web/jc-unifying-strand.html")
          html = page.read_text(encoding="utf-8")
          if 'jc-unifying-table' not in html or 'U.13' not in html or 'U.1' not in html:
              raise SystemExit("The complete native Unifying Strand table was not built.")
          if 'interactives/jc-unifying.html' in html or 'interactive-jc-unifying-overview' in html:
              raise SystemExit("An old embedded Unifying Strand reader remains in the Introduction.")
          if '</head>' not in html or '</body>' not in html:
              raise SystemExit("The Introduction HTML is incomplete.")
          css = '<link rel="stylesheet" href="jc-unifying-native.css?v=1" data-jc-native="1"/>'
          js = '<script defer src="jc-unifying-native.js?v=1" data-jc-native="1"></script>'
          html = html.replace('</head>', '  '+css+'\n</head>', 1)
          html = html.replace('</body>', '  '+js+'\n</body>', 1)
          page.write_text(html, encoding="utf-8")
          print("All 13 Unifying Strand outcomes are now native PreTeXt; modal uses top-level dialog.")
          PY
      - name: Copy fertility and literacy interactive
        run: |
          set -euo pipefail
          mkdir -p output/web/interactives
          cp assets/interactives/fertility-literacy.html output/web/interactives/fertility-literacy.html
          test -s output/web/functions-intro.html
          grep -q 'fertility-literacy.html' output/web/functions-intro.html
          test -s output/web/interactives/fertility-literacy.html
      - name: Add separate ABCD shortcuts to PreTeXt navigation
        run: |
          set -euo pipefail
          cp assets/quick-links.js output/web/quick-links.js
          cp assets/quick-links.css output/web/quick-links.css
          python - <<'PY'
          from pathlib import Path
          root=Path("output/web")
          tag='<script defer src="quick-links.js?v=1" data-maths-quick-links="abcd"></script>'
          updated=0
          for page in root.glob("*.html"):
              html=page.read_text(encoding="utf-8")
              if '</body>' not in html:
                  continue
              if 'data-maths-quick-links="abcd"' in html:
                  continue
              page.write_text(html.replace("</body>",f"  {tag}\n</body>",1),encoding="utf-8")
              updated+=1
          if not updated:
              raise SystemExit("No PreTeXt pages received the ABCD shortcut navigation.")
          print(f"Added separate four-dot shortcuts to {updated} book pages.")
          PY
      - name: Apply programme colours to Parts and Chapters
        run: |
          set -euo pipefail
          python scripts/apply_programme_colours.py
          node --check output/web/programme-colours.js
          grep -q 'maths-chapter-link' output/web/programme-colours.js
          grep -q 'maths-chapter-bg' output/web/programme-colours.css
      - name: Enable accessible diagram enlargement throughout the book
        run: |
          set -euo pipefail
          node --check assets/diagram-zoom.js
          python scripts/add_diagram_zoom.py
          test -s output/web/diagram-zoom.js
          test -s output/web/diagram-zoom.css
          grep -q 'data-maths-diagram-zoom="yes"' output/web/sets-two-sets.html
          grep -q 'data-maths-diagram-zoom="yes"' output/web/sets-domain-codomain.html
      - name: Apply responsive learning-outcome typography
        run: |
          set -euo pipefail
          cp assets/strand-outcomes.css output/web/strand-outcomes.css
          python - <<'PY'
          from pathlib import Path
          root = Path("output/web")
          expected = [
              "jc-introduction", "jc-unifying-strand",
              "jc-outcomes-number", "jc-outcomes-geometry",
              "jc-outcomes-algebra", "jc-outcomes-statistics",
              "lc-ol-introduction",
              "lc-ol-statistics-outcomes", "lc-ol-geometry-outcomes",
              "lc-ol-number-outcomes", "lc-ol-algebra-outcomes",
              "lc-ol-functions-outcomes",
          ]
          for name in expected:
              path = root / (name + ".html")
              if not path.is_file():
                  raise SystemExit("Required curriculum page is missing: " + name)
              html = path.read_text(encoding="utf-8")
              if "</head>" not in html:
                  raise SystemExit("Invalid HTML page: " + name)
              tag = '<link rel="stylesheet" href="strand-outcomes.css?v=1" data-strand-outcomes="true"/>'
              if 'data-strand-outcomes="true"' not in html:
                  html = html.replace("</head>", "  " + tag + "\n</head>", 1)
                  path.write_text(html, encoding="utf-8")
          for key in ("number", "geometry", "algebra", "statistics"):
              page = (root / ("jc-outcomes-" + key + ".html")).read_text(encoding="utf-8")
              if "Students should be able to" not in page:
                  raise SystemExit("Missing Junior Cycle outcomes table: " + key)
          for key in ("statistics", "geometry", "number", "algebra", "functions"):
              page = (root / ("lc-ol-" + key + "-outcomes.html")).read_text(encoding="utf-8")
              if "Ordinary Level" not in page:
                  raise SystemExit("Missing LC Ordinary Level outcomes: " + key)
          print("Validated 12 responsive introduction and strand pages.")
          PY
      - name: Enable two-level native learning outcome pop-ups
        run: |
          set -euo pipefail
          node --check assets/strand-outcome-drill.js
          cp assets/strand-outcome-drill.js output/web/strand-outcome-drill.js
          cp assets/strand-outcome-drill.css output/web/strand-outcome-drill.css
          python - <<'PY'
          from pathlib import Path
          root = Path("output/web")
          pages = {
              "jc-outcomes-number": ("N.1", "N.5"),
              "jc-outcomes-geometry": ("GT.1", "GT.6"),
              "jc-outcomes-algebra": ("AF.1", "AF.7"),
              "jc-outcomes-statistics": ("SP.1", "SP.3"),
              "lc-ol-statistics-outcomes": ("1.1", "1.7"),
              "lc-ol-geometry-outcomes": ("2.1", "2.4"),
              "lc-ol-number-outcomes": ("3.1", "3.4"),
              "lc-ol-algebra-outcomes": ("4.1", "4.4"),
              "lc-ol-functions-outcomes": ("5.1", "5.2"),
          }
          css = '<link rel="stylesheet" href="strand-outcome-drill.css?v=1" data-lo-drill="true"/>'
          script = '<script defer src="strand-outcome-drill.js?v=1" data-lo-drill="true"></script>'
          for name, labels in pages.items():
              page = root / (name + ".html")
              if not page.is_file():
                  raise SystemExit("Outcome page absent: " + name)
              html = page.read_text(encoding="utf-8")
              if not all(label in html for label in labels):
                  raise SystemExit("Incomplete numbered outcomes: " + name)
              table_id = (name.removesuffix("-outcomes") if name.startswith("lc-ol-") else name) + "-table"
              if table_id not in html:
                  raise SystemExit("No native outcome table: " + name + " (" + table_id + ")")
              if "</head>" not in html or "</body>" not in html:
                  raise SystemExit("Malformed outcome HTML: " + name)
              if 'data-lo-drill="true"' not in html:
                  html = html.replace("</head>", "  " + css + "\n</head>", 1)
                  html = html.replace("</body>", "  " + script + "\n</body>", 1)
                  page.write_text(html, encoding="utf-8")
          print("Added accessible optional subpart drill-down to all 9 JC and LC OL strand pages.")
          PY
      - name: Add Junior Cycle Algebra seven-slide view
        run: |
          set -euo pipefail
          cp assets/jc-algebra-outcome-slides.js output/web/jc-algebra-outcome-slides.js
          cp assets/jc-algebra-outcome-slides.css output/web/jc-algebra-outcome-slides.css
          python - <<'PY'
          from pathlib import Path
          page = Path("output/web/jc-outcomes-algebra.html")
          html = page.read_text(encoding="utf-8")
          if not all(code in html for code in ("AF.1", "AF.2", "AF.3", "AF.4", "AF.5", "AF.6", "AF.7")):
              raise SystemExit("The seven Algebra outcomes are not present.")
          if "jc-algebra-original-scroll" not in html or "#page=18&amp;zoom=100" not in html:
              raise SystemExit("The scrollable original Algebra source pages are not present.")
          if "data-jc-algebra-slides" not in html:
              css = '<link rel="stylesheet" href="jc-algebra-outcome-slides.css?v=1" data-jc-algebra-slides="true"/>'
              script = '<script defer src="jc-algebra-outcome-slides.js?v=1" data-jc-algebra-slides="true"></script>'
              html = html.replace("</head>", "  " + css + "\n</head>", 1)
              html = html.replace("</body>", "  " + script + "\n</body>", 1)
              page.write_text(html, encoding="utf-8")
          print("Added the scrollable NCCA pages and seven-outcome Algebra slide view.")
          PY
      - name: Verify exactly three populated Maths Parts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          root = etree.parse("source/main.ptx")
          NS = "{http://www.w3.org/XML/1998/namespace}"
          expected = [
              "part-junior-cycle",
              "part-leaving-certificate",
              "part-transition-year",
          ]
          parts = [part.get(NS + "id") for part in root.findall(".//part")]
          if parts != expected:
              raise SystemExit("Expected JC Maths, LC OL Maths, TY Maths only; got " + str(parts))
          root.xinclude()
          for part in root.findall(".//part"):
              chapters = part.findall("./chapter")
              if not chapters:
                  raise SystemExit("Empty Part: " + part.get(NS + "id"))
              for chapter in chapters:
                  if "Coming soon" in " ".join(chapter.itertext()):
                      raise SystemExit("Placeholder in published chapter " + str(chapter.get(NS + "id")))
          site = Path("output/web")
          expected_pages = {part + ".html" for part in expected}
          actual_pages = {p.name for p in site.glob("part-*.html")}
          if actual_pages != expected_pages:
              raise SystemExit("Unexpected published Parts: " + str(sorted(actual_pages)))
          required = [
              "jc-introduction.html",
              "jc-unifying-strand.html",
              "jc-outcomes-number.html",
              "jc-outcomes-geometry.html",
              "jc-outcomes-algebra.html",
              "jc-outcomes-statistics.html",
              "sets-domain-codomain.html",
              "chapter-glossary.html",
              "lc-ol-introduction.html",
              "lc-ol-statistics-outcomes.html",
              "lc-ol-geometry-outcomes.html",
              "lc-ol-number-outcomes.html",
              "lc-ol-algebra-outcomes.html",
              "lc-ol-functions-outcomes.html",
              "chapter-complex.html",
              "chapter-sequences.html",
              "chapter-ty-programme.html",
          ]
          missing = [name for name in required if not (site / name).is_file()]
          if missing:
              raise SystemExit("Missing populated pages: " + ", ".join(missing))
          for name in ("part-junior-cycle.html","part-leaving-certificate.html","part-transition-year.html"):
              if 'data-maths-programme="colour"' not in (site / name).read_text(encoding="utf-8"):
                  raise SystemExit("Missing colour navigation: " + name)
          print("Verified precisely three Maths Parts, learning outcomes, glossary and substantial content.")
          PY
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
