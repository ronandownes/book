name: Build and publish PreTeXt book
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PreTeXt
        run: python -m pip install -r requirements.txt
      - name: Retrieve open-licence cicada photographs
        run: |
          set -euo pipefail
          mkdir -p assets/cicadas
          curl --fail --location --retry 3 --silent --show-error \
            --user-agent "Mathematics educational textbook (source: Wikimedia Commons)" \
            "https://upload.wikimedia.org/wikipedia/commons/a/a9/Riley%27s_13-Year_Cicada_Magicicada_tredecim_JG.jpg" \
            --output assets/cicadas/magicicada-tredecim-2024.jpg
          curl --fail --location --retry 3 --silent --show-error \
            --user-agent "Mathematics educational textbook (source: Wikimedia Commons)" \
            "https://upload.wikimedia.org/wikipedia/commons/8/8e/Magicicada_septendecim-mating.jpg" \
            --output assets/cicadas/magicicada-septendecim-2024.jpg
          curl --fail --location --retry 3 --silent --show-error \
            --user-agent "Mathematics educational textbook (source: Wikimedia Commons)" \
            "https://upload.wikimedia.org/wikipedia/commons/9/9e/Periodical_cicadas_in_a_tree.jpg" \
            --output assets/cicadas/periodical-cicadas-tree-2024.jpg
          test "$(wc -c < assets/cicadas/periodical-cicadas-tree-2024.jpg)" -gt 50000
          test "$(wc -c < assets/cicadas/magicicada-tredecim-2024.jpg)" -gt 50000
          test "$(wc -c < assets/cicadas/magicicada-septendecim-2024.jpg)" -gt 50000
      - name: Generate native NCCA curriculum appendices
        run: |
          set -euo pipefail
          python -m pip install requests beautifulsoup4 pymupdf
          mkdir -p assets/syllabus
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 --silent --show-error \
            "https://www.curriculumonline.ie/getmedia/f6f2e822-2b0c-461e-bcd4-dfcde6decc0c/SCSEC25_Maths_syllabus_examination-2015_English.pdf" \
            --output assets/syllabus/LC_Mathematics_Syllabus_2015.pdf
          python scripts/build_curriculum_appendices.py
          python scripts/build_intro_outcomes.py
          test -s source/appendices.ptx
          for strand in number geometry algebra statistics; do
            test -s "source/jc-${strand}-outcomes.ptx"
          done
          for strand in statistics geometry number algebra functions; do
            test -s "source/lc-ol-${strand}-outcomes.ptx"
          done
      - name: Build web textbook
        run: pretext build web
      - name: Add immediate checking to single-choice questions
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          site = Path("output/web")
          script = Path("assets/sets/auto-check.js")
          if not script.is_file():
              raise SystemExit("Auto-check source is missing.")
          source = script.read_text(encoding="utf-8")
          if "</script>" in source.lower():
              raise SystemExit("Auto-check source cannot be embedded safely.")
          marker = 'data-pretext-auto-check="sets-v4"'
          pattern = re.compile(r'<script data-pretext-auto-check="sets-[^"]+">.*?</script>', re.DOTALL)
          tag = f'<script {marker}>\n{source}\n</script>'
          updated = 0
          for page in site.rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              html = pattern.sub("", html)
              if "</body>" not in html:
                  continue
              page.write_text(html.replace("</body>", f"  {tag}\n</body>", 1), encoding="utf-8")
              updated += 1
          target = site / "sets-complement.html"
          if not target.is_file() or marker not in target.read_text(encoding="utf-8"):
              raise SystemExit("The Sets complement page is missing its automatic-check script.")
          if updated == 0:
              raise SystemExit("No web pages received automatic-check handling.")
          print(f"Embedded automatic checking in {updated} pages.")
          PY
      - name: Enhance native Junior Cycle Unifying Strand table
        run: |
          set -euo pipefail
          node --check assets/jc-unifying-native.js
          cp assets/jc-unifying-native.js output/web/jc-unifying-native.js
          cp assets/jc-unifying-native.css output/web/jc-unifying-native.css
          python - <<'PY'
          from pathlib import Path
          page = Path("output/web/jc-unifying-strand.html")
          html = page.read_text(encoding="utf-8")
          if 'jc-unifying-table' not in html or 'U.13' not in html or 'U.1' not in html:
              raise SystemExit("The complete native Unifying Strand table was not built.")
          if 'interactives/jc-unifying.html' in html or 'interactive-jc-unifying-overview' in html:
              raise SystemExit("An old embedded Unifying Strand reader remains in the Introduction.")
          if '</head>' not in html or '</body>' not in html:
              raise SystemExit("The Introduction HTML is incomplete.")
          css = '<link rel="stylesheet" href="jc-unifying-native.css?v=1" data-jc-native="1"/>'
          js = '<script defer src="jc-unifying-native.js?v=1" data-jc-native="1"></script>'
          html = html.replace('</head>', '  '+css+'\n</head>', 1)
          html = html.replace('</body>', '  '+js+'\n</body>', 1)
          page.write_text(html, encoding="utf-8")
          print("All 13 Unifying Strand outcomes are now native PreTeXt; modal uses top-level dialog.")
          PY
      - name: Copy fertility and literacy interactive
        run: |
          set -euo pipefail
          mkdir -p output/web/interactives
          cp assets/interactives/fertility-literacy.html output/web/interactives/fertility-literacy.html
          test -s output/web/functions-intro.html
          grep -q 'fertility-literacy.html' output/web/functions-intro.html
          test -s output/web/interactives/fertility-literacy.html
      - name: Add separate ABCD shortcuts to PreTeXt navigation
        run: |
          set -euo pipefail
          cp assets/quick-links.js output/web/quick-links.js
          cp assets/quick-links.css output/web/quick-links.css
          python - <<'PY'
          from pathlib import Path
          root=Path("output/web")
          tag='<script defer src="quick-links.js?v=1" data-maths-quick-links="abcd"></script>'
          updated=0
          for page in root.glob("*.html"):
              html=page.read_text(encoding="utf-8")
              if '</body>' not in html:
                  continue
              if 'data-maths-quick-links="abcd"' in html:
                  continue
              page.write_text(html.replace("</body>",f"  {tag}\n</body>",1),encoding="utf-8")
              updated+=1
          if not updated:
              raise SystemExit("No PreTeXt pages received the ABCD shortcut navigation.")
          print(f"Added separate four-dot shortcuts to {updated} book pages.")
          PY
      - name: Apply programme colours to Parts and Chapters
        run: |
          set -euo pipefail
          python scripts/apply_programme_colours.py
          node --check output/web/programme-colours.js
          grep -q 'maths-chapter-link' output/web/programme-colours.js
          grep -q 'maths-chapter-bg' output/web/programme-colours.css
      - name: Enable accessible diagram enlargement throughout the book
        run: |
          set -euo pipefail
          node --check assets/diagram-zoom.js
          python scripts/add_diagram_zoom.py
          test -s output/web/diagram-zoom.js
          test -s output/web/diagram-zoom.css
          grep -q 'data-maths-diagram-zoom="yes"' output/web/sets-two-sets.html
          grep -q 'data-maths-diagram-zoom="yes"' output/web/sets-domain-codomain.html
      - name: Verify native appendices glossary and programme navigation
        run: |
          set -euo pipefail
          for page in \
            part-junior-cycle.html \
            part-transition-year.html \
            part-leaving-certificate.html \
            part-official-appendices.html \
            jc-official-unifying.html \
            lc-official-statistics.html \
            chapter-glossary.html; do
            test -s "output/web/$page" || { echo "Missing $page"; exit 1; }
          done
          test ! -e output/web/section-spec-junior-cycle.html || { echo "Legacy PDF specification section still published"; exit 1; }
          grep -q 'data-maths-programme="colour"' output/web/part-junior-cycle.html
          ! grep -q 'syllabus/reader.html' output/web/jc-official-unifying.html
          ! grep -q 'syllabus/reader.html' output/web/lc-official-statistics.html
          echo "Verified programme navigation, native appendices, glossary and removal of old viewer."
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
