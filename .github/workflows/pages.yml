name: Build and publish PreTeXt book
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PreTeXt
        run: python -m pip install -r requirements.txt
      - name: Retrieve open-licence cicada photographs
        run: |
          set -euo pipefail
          mkdir -p assets/cicadas
          curl --fail --location --retry 3 --silent --show-error \
            --user-agent "Mathematics educational textbook (source: Wikimedia Commons)" \
            "https://upload.wikimedia.org/wikipedia/commons/a/a9/Riley%27s_13-Year_Cicada_Magicicada_tredecim_JG.jpg" \
            --output assets/cicadas/magicicada-tredecim-2024.jpg
          curl --fail --location --retry 3 --silent --show-error \
            --user-agent "Mathematics educational textbook (source: Wikimedia Commons)" \
            "https://upload.wikimedia.org/wikipedia/commons/8/8e/Magicicada_septendecim-mating.jpg" \
            --output assets/cicadas/magicicada-septendecim-2024.jpg
          curl --fail --location --retry 3 --silent --show-error \
            --user-agent "Mathematics educational textbook (source: Wikimedia Commons)" \
            "https://upload.wikimedia.org/wikipedia/commons/9/9e/Periodical_cicadas_in_a_tree.jpg" \
            --output assets/cicadas/periodical-cicadas-tree-2024.jpg
          test "$(wc -c < assets/cicadas/periodical-cicadas-tree-2024.jpg)" -gt 50000
          test "$(wc -c < assets/cicadas/magicicada-tredecim-2024.jpg)" -gt 50000
          test "$(wc -c < assets/cicadas/magicicada-septendecim-2024.jpg)" -gt 50000
      - name: Build web textbook
        run: pretext build web
      - name: Add immediate checking to single-choice questions
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          site = Path("output/web")
          script = Path("assets/sets/auto-check.js")
          if not script.is_file():
              raise SystemExit("Auto-check source is missing.")
          source = script.read_text(encoding="utf-8")
          if "</script>" in source.lower():
              raise SystemExit("Auto-check source cannot be embedded safely.")
          marker = 'data-pretext-auto-check="sets-v4"'
          pattern = re.compile(r'<script data-pretext-auto-check="sets-[^"]+">.*?</script>', re.DOTALL)
          tag = f'<script {marker}>\n{source}\n</script>'
          updated = 0
          for page in site.rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              html = pattern.sub("", html)
              if "</body>" not in html:
                  continue
              page.write_text(html.replace("</body>", f"  {tag}\n</body>", 1), encoding="utf-8")
              updated += 1
          target = site / "sets-complement.html"
          if not target.is_file() or marker not in target.read_text(encoding="utf-8"):
              raise SystemExit("The Sets complement page is missing its automatic-check script.")
          if updated == 0:
              raise SystemExit("No web pages received automatic-check handling.")
          print(f"Embedded automatic checking in {updated} pages.")
          PY
      - name: Copy fertility and literacy interactive
        run: |
          set -euo pipefail
          mkdir -p output/web/interactives
          cp assets/interactives/fertility-literacy.html output/web/interactives/fertility-literacy.html
          test -s output/web/functions-intro.html
          grep -q 'fertility-literacy.html' output/web/functions-intro.html
          test -s output/web/interactives/fertility-literacy.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
