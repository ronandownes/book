name: Build and publish PreTeXt book
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PreTeXt
        run: python -m pip install -r requirements.txt
      - name: Retrieve open-licence cicada photographs
        run: |
          set -euo pipefail
          mkdir -p assets/cicadas
          curl --fail --location --retry 3 --silent --show-error \
            --user-agent "Mathematics educational textbook (source: Wikimedia Commons)" \
            "https://upload.wikimedia.org/wikipedia/commons/a/a9/Riley%27s_13-Year_Cicada_Magicicada_tredecim_JG.jpg" \
            --output assets/cicadas/magicicada-tredecim-2024.jpg
          curl --fail --location --retry 3 --silent --show-error \
            --user-agent "Mathematics educational textbook (source: Wikimedia Commons)" \
            "https://upload.wikimedia.org/wikipedia/commons/8/8e/Magicicada_septendecim-mating.jpg" \
            --output assets/cicadas/magicicada-septendecim-2024.jpg
          curl --fail --location --retry 3 --silent --show-error \
            --user-agent "Mathematics educational textbook (source: Wikimedia Commons)" \
            "https://upload.wikimedia.org/wikipedia/commons/9/9e/Periodical_cicadas_in_a_tree.jpg" \
            --output assets/cicadas/periodical-cicadas-tree-2024.jpg
          test "$(wc -c < assets/cicadas/periodical-cicadas-tree-2024.jpg)" -gt 50000
          test "$(wc -c < assets/cicadas/magicicada-tredecim-2024.jpg)" -gt 50000
          test "$(wc -c < assets/cicadas/magicicada-septendecim-2024.jpg)" -gt 50000
      - name: Build web textbook
        run: pretext build web
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
